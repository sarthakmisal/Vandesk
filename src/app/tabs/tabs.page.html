<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="fees">
      <span class="ti">💰</span>
      <ion-label>{{ t['title'] }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="students">
      <span class="ti">🧒</span>
      <ion-label>{{ t['students'] }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="trip">
      <span class="ti">🚐</span>
      <ion-label>{{ t['trip'] }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
