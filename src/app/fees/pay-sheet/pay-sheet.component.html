<div class="ps">
  <div class="who">
    {{ row.name }}<small>{{ row.months }} {{ t().months }}</small>
  </div>
  <div class="amt">{{ money(amount()) }}</div>

  <div class="chips">
    @for (s of row.steps; track s; let i = $index; let last = $last) {
      <button type="button" [class.on]="!custom() && amount() === s" (click)="pick(s)">
        {{ last ? t().all : i + 1 }}<b>{{ money(s) }}</b>
      </button>
    }
  </div>

  @if (!custom()) {
    <button type="button" class="lnk" (click)="custom.set(true)">{{ t().other }}</button>
  } @else {
    <input type="number" inputmode="numeric" min="1" placeholder="₹" aria-label="Amount" (input)="setCustom($event)" />
  }

  <div class="mode">
    <button type="button" [class.on]="mode() === 'cash'" (click)="mode.set('cash')">💵 {{ t().cash }}</button>
    <button type="button" [class.on]="mode() === 'upi'" (click)="mode.set('upi')">📱 {{ t().upi }}</button>
  </div>

  <button type="button" class="go" [disabled]="!(amount() > 0)" (click)="ok()">
    ✓ {{ t().received }} {{ money(amount()) }}
  </button>
</div>
