<ion-content [fullscreen]="true">
  <div class="wrap">
    <section class="hero">
      <div class="top"><span class="brand">🚐 {{ t['title'] }}</span>
        <div class="lang"><button *ngFor="let l of langs" [class.on]="l === lang" (click)="setLang(l)">{{ l === 'en' ? 'EN' : l === 'hi' ? 'हि' : 'म' }}</button></div></div>
      <div class="big">{{ m(pending) }}</div>
      <div class="sub">{{ t['pending'] }} · {{ rows.length }}</div>
      <div class="pill">{{ t['today'] }} <b>{{ m(today) }}</b></div>
    </section>

    <ng-container *ngIf="loading"><div class="sk" *ngFor="let i of [1, 2, 3, 4]"></div></ng-container>
    <div class="err" *ngIf="err && !loading">{{ t['err'] }}<button (click)="load()">{{ t['retry'] }}</button></div>

    <article class="card" *ngFor="let r of rows; trackBy: trk" (click)="open(r)" tabindex="0">
      <div class="av" [style.background]="hue(r.name)">{{ r.name[0] }}</div>
      <div class="mid"><b>{{ r.name }}</b><span>{{ r.months }} {{ t['months'] }}</span></div>
      <div class="right"><b>{{ m(r.balance) }}</b><span class="btn">✓ {{ t['received'] }}</span></div>
    </article>

    <div class="clear" *ngIf="!loading && !err && !rows.length">🎉 {{ t['clear'] }}</div>
  </div>
</ion-content>
